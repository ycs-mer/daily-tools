<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>做什麼</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="做什麼">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#EEF1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06112D" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#EEF1F8;--card:#fff;--ink:#06112D;--mut:#646b80;--line:#dde2ee;--acc:#147D6B;--acc-ink:#fff;--tint:#E7F9F4;--tint-ink:#0d5c4c;--warm:#FFE7DD;--warm-ink:#8a3415;--danger:#b3261e}
@media (prefers-color-scheme: dark){:root{--bg:#06112D;--card:#101d42;--ink:#EEF1F8;--mut:#9aa4bd;--line:#24325e;--acc:#5fd3bd;--acc-ink:#06112D;--tint:#123a36;--tint-ink:#bdeee2;--warm:#4a2a26;--warm-ink:#ffc4b0;--danger:#ff8a80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:16px;line-height:1.5}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 84px);max-width:560px;margin:0 auto;min-height:100vh}
h1{font-size:24px;margin:8px 0 14px;font-weight:700}
h2{font-size:14px;color:var(--mut);font-weight:600;margin:18px 0 8px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.name{font-weight:600;font-size:17px}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--tint-ink);white-space:nowrap}
.pill.w{background:var(--warm);color:var(--warm-ink)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.d{color:var(--danger)}
button.w{width:100%}
button.s{min-height:36px;padding:6px 12px;font-size:14px}
button.big{font-size:18px;min-height:56px}
input,textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.seg .chip{min-height:44px;font-size:16px}
.result{text-align:center;padding:28px 14px}
.result .big{font-size:26px;font-weight:700;line-height:1.3}
.note{border-top:1px solid var(--line);padding:10px 0}
.note:first-child{border-top:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav button{border:none;background:none;min-height:48px;flex:1;color:var(--mut);font-size:13px;padding:4px}
nav button.on{color:var(--ink);font-weight:700}
nav b{display:block;font-size:20px;line-height:1.1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
.empty{text-align:center;padding:28px 12px}
.gap{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.back{border:none;background:none;padding:0;color:var(--mut);min-height:36px}
pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--bg);border-radius:12px;padding:10px;margin:8px 0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
'use strict';
const KEY='whattodo.v1';
const CN={food:'吃的',act:'週末活動'};
const DIM={
  food:[{k:'mode',n:'方式',o:['內用','外送'],multi:1},{k:'price',n:'價位',o:['省','一般','犒賞']},{k:'ppl',n:'人數',o:['一個人','多人'],multi:1}],
  act:[{k:'dur',n:'時間',o:['2 小時內','半天','整天']},{k:'place',n:'場地',o:['室內','戶外']},{k:'book',n:'預約',o:['免預約','要預約']},{k:'ppl',n:'人數',o:['一個人','約人'],multi:1},{k:'energy',n:'體力',o:['輕鬆','中等','耗體力']}]};
const ST={try:'待嘗試',like:'喜歡',ok:'普通'};
const MAXRE=3;
let db=load();
let ui={tab:'draw',cat:'food',f:{},round:null,poolCat:'food',edit:null,bulk:{text:'',rows:null}};

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items))return d}catch(e){}return{items:[],lastExport:null}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function days(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function item(id){return db.items.find(x=>x.id===id)}
function ago(s){if(!s)return'還沒選過';const n=days(s,today());if(n<=0)return'今天選過';if(n<14)return n+' 天前選過';if(n<60)return Math.round(n/7)+' 週前選過';return Math.round(n/30)+' 個月前選過'}
function tagLine(it){return DIM[it.cat].map(d=>(it.t[d.k]||[]).join('/')).filter(Boolean).join(' · ')}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}

function matches(it,cat,f){if(it.cat!==cat)return false;return DIM[cat].every(d=>{const sel=f[d.k]||[];if(!sel.length)return true;const v=it.t[d.k]||[];return!v.length||v.some(x=>sel.includes(x))})}
function pool(){return db.items.filter(it=>matches(it,ui.cat,ui.f))}
function weight(it){let w=it.status==='like'?1.5:it.status==='try'?1.3:1;if(it.last){const n=days(it.last,today());if(n<7)w*=0.2;else if(n<21)w*=0.6}return w}
function pickOne(list){const tot=list.reduce((s,x)=>s+weight(x),0);let r=Math.random()*tot;for(const x of list){r-=weight(x);if(r<=0)return x}return list[list.length-1]}

function vDraw(){
  let h='<h1>做什麼</h1>';
  const pend=db.items.filter(x=>x.pend);
  pend.forEach(it=>{h+=`<div class="card"><div class="mut">上次選的，覺得如何？</div><div class="row sp"><span class="name">${esc(it.name)}</span>${it.cat==='act'&&(it.t.book||[]).includes('要預約')?`<button class="s ${it.booked?'p':''}" data-a="booked" data-id="${it.id}">${it.booked?'已預約':'標記已預約'}</button>`:''}</div>
    <div class="gap"><button class="s" data-a="rate" data-id="${it.id}" data-v="like">喜歡</button><button class="s" data-a="rate" data-id="${it.id}" data-v="ok">普通</button><button class="s d" data-a="rate" data-id="${it.id}" data-v="del">移除</button><button class="s" data-a="rate" data-id="${it.id}" data-v="none">沒去</button></div></div>`});
  if(ui.round)return h+vResult();
  h+=`<div class="seg">${Object.keys(CN).map(c=>`<button class="chip ${ui.cat===c?'on':''}" data-a="cat" data-c="${c}">${CN[c]}</button>`).join('')}</div>`;
  if(!db.items.some(x=>x.cat===ui.cat))return h+`<div class="card empty"><p class="name">先放進幾個選項</p><p class="mut">把常去的、想試的都丟進選項池，之後交給它決定。</p><div class="gap" style="justify-content:center"><button class="p" data-a="newItem">新增選項</button><button data-a="go" data-tab="bulk">批次匯入</button></div></div>`;
  DIM[ui.cat].forEach(d=>{const sel=ui.f[d.k]||[];h+=`<label>${d.n}</label><div class="chips">${d.o.map(o=>`<button class="chip ${sel.includes(o)?'on':''}" data-a="filt" data-k="${d.k}" data-v="${o}">${o}</button>`).join('')}</div>`});
  const n=pool().length;
  h+=`<p class="mut" style="margin-top:14px">不選就是都可以。符合條件的有 ${n} 個。</p><button class="p w big" data-a="draw">${n?'抽一個':'沒有符合的選項'}</button>`;
  if(ui.cat==='act')h+='<p class="mut" style="text-align:center">需要預約的活動，建議週四或週五先抽。</p>';
  return h}
function vResult(){
  const r=ui.round,it=item(r.cur);if(!it){ui.round=null;return''}
  const rest=pool().filter(x=>!r.seen.includes(x.id)).length,can=r.left>0&&rest>0;
  return`<div class="card result"><div class="mut">${it.cat==='food'?'今天就吃':'這個週末就去'}</div><div class="big">${esc(it.name)}</div><div class="mut" style="margin-top:8px">${esc(tagLine(it))}</div><div class="mut">${ago(it.last)}${it.status==='try'?' · 待嘗試':''}</div>${it.note?`<div class="mut" style="margin-top:8px">${esc(it.note)}</div>`:''}</div>
  <button class="p w big" data-a="accept">就這個</button>
  <div class="gap"><button class="w" data-a="reroll" ${can?'':'disabled style="opacity:.5"'}>${r.left<=0?'重抽次數用完了，就這個吧':rest<=0?'沒有其他符合的選項了':'重抽（剩 '+r.left+' 次）'}</button></div>
  <div class="gap"><button class="back w" data-a="cancelRound">改條件</button></div>`}

function vPool(){
  const l=db.items.filter(x=>x.cat===ui.poolCat).sort((a,b)=>({try:0,like:1,ok:2}[a.status]-{try:0,like:1,ok:2}[b.status])||a.name.localeCompare(b.name,'zh-Hant'));
  return`<div class="row sp"><h1>選項池</h1><button class="p s" data-a="newItem">＋ 新增</button></div>
  <div class="seg">${Object.keys(CN).map(c=>`<button class="chip ${ui.poolCat===c?'on':''}" data-a="poolCat" data-c="${c}">${CN[c]} ${db.items.filter(x=>x.cat===c).length}</button>`).join('')}</div>
  ${l.length?l.map(it=>`<div class="card" data-a="editItem" data-id="${it.id}"><div class="row sp"><span class="name">${esc(it.name)}</span><span class="pill ${it.status==='try'?'w':''}">${ST[it.status]}</span></div><div class="mut">${esc(tagLine(it))||'沒有標籤'}</div><div class="mut">${ago(it.last)}</div></div>`).join(''):'<div class="card empty mut">這個類別還沒有選項</div>'}`}

function vEdit(){
  const e=ui.edit;
  let h=`<button class="back" data-a="go" data-tab="pool">‹ 取消</button><h1>${e.id?'編輯選項':'新增選項'}</h1>
  <div class="seg">${Object.keys(CN).map(c=>`<button class="chip ${e.cat===c?'on':''}" data-a="setCat" data-c="${c}">${CN[c]}</button>`).join('')}</div>
  <label>名稱</label><input data-m="edit.name" value="${esc(e.name)}" placeholder="${e.cat==='food'?'巷口越南河粉':'陶藝體驗課'}" autocomplete="off">`;
  DIM[e.cat].forEach(d=>{const sel=e.t[d.k]||[];h+=`<label>${d.n}${d.multi?'（可複選）':''}</label><div class="chips">${d.o.map(o=>`<button class="chip ${sel.includes(o)?'on':''}" data-a="tag" data-k="${d.k}" data-v="${o}">${o}</button>`).join('')}</div>`});
  h+=`<label>狀態</label><div class="chips">${Object.keys(ST).map(s=>`<button class="chip ${e.status===s?'on':''}" data-a="setSt" data-v="${s}">${ST[s]}</button>`).join('')}</div>
  <label>備註（選填）</label><input data-m="edit.note" value="${esc(e.note||'')}" placeholder="地址、連結或想點的東西">
  <p class="mut">標籤沒選的話，任何條件都會抽到它。</p>
  <div class="gap"><button class="p w" data-a="saveItem">儲存</button></div>
  ${e.id?'<div class="gap"><button class="d w" data-a="delItem">刪除</button></div>':''}`;
  return h}

function vSet(){
  return`<h1>設定</h1>
  <h2>備份</h2><div class="card"><p class="mut" style="margin-top:0">資料只存在這支手機。換手機前先匯出，到新手機再匯入。${db.lastExport?'上次匯出：'+db.lastExport:'還沒匯出過。'}</p>
  <div class="gap"><button class="p" data-a="export">匯出備份</button><button data-a="importPick">匯入備份</button></div><input type="file" id="impFile" accept=".json,application/json" hidden></div>
  <h2>初始設定</h2><div class="card"><p class="mut" style="margin-top:0">一次加入很多選項。</p><button data-a="go" data-tab="bulk">批次匯入選項</button></div>
  <p class="mut" style="text-align:center">吃的 ${db.items.filter(x=>x.cat==='food').length} 個 · 週末活動 ${db.items.filter(x=>x.cat==='act').length} 個</p>`}

function vBulk(){
  const b=ui.bulk;
  let h=`<button class="back" data-a="go" data-tab="set">‹ 設定</button><h1>批次匯入</h1>
  <p class="mut">一行一個選項，第一欄是名稱。其他欄用逗號或 Tab 分隔，順序不拘，認不出的字會放進備註。</p>
  <pre>巷口越南河粉, 吃, 內用, 一般, 一個人
週五火鍋, 吃, 內用, 犒賞, 多人
陶藝體驗課, 活動, 半天, 室內, 要預約, 待嘗試
河邊騎腳踏車, 活動, 2小時內, 戶外, 免預約, 耗體力</pre>
  <p class="mut">類別寫「吃」或「活動」。沒寫時會依標籤判斷，判斷不出來就用下面選的類別。狀態可寫待嘗試、喜歡、普通，沒寫就是待嘗試。</p>
  <div class="seg">${Object.keys(CN).map(c=>`<button class="chip ${ui.poolCat===c?'on':''}" data-a="bulkCat" data-c="${c}">預設：${CN[c]}</button>`).join('')}</div>
  <textarea data-m="bulk.text" style="min-height:160px" placeholder="從試算表或記事本貼上">${esc(b.text)}</textarea>
  <div class="gap"><button data-a="bulkFile">選擇檔案（.csv / .txt）</button><button class="p" data-a="bulkPreview">預覽</button></div><input type="file" id="bulkF" accept=".csv,.txt,.tsv,text/plain,text/csv" hidden>`;
  if(b.rows){
    h+=`<h2>預覽：${b.rows.length} 個${b.dup?'，另有 '+b.dup+' 個已在選項池會略過':''}</h2><div class="card">${b.rows.length?b.rows.map(r=>`<div class="note"><span class="name">${esc(r.name)}</span> <span class="pill">${CN[r.cat]}</span> <span class="pill w">${ST[r.status]}</span><div class="mut">${esc(tagLine(r))||'沒有標籤'}${r.note?' · 備註：'+esc(r.note):''}</div></div>`).join(''):'<div class="mut">沒有可匯入的資料</div>'}</div>
    ${b.rows.length?`<button class="p w" data-a="bulkCommit">匯入這 ${b.rows.length} 個</button>`:''}`}
  return h}

function norm(s){return s.replace(/\s/g,'')}
function parseBulk(text,defCat){
  const rows=[];let dup=0;const seen=new Set(db.items.map(x=>x.cat+'|'+x.name.toLowerCase()));
  const alias={'一人':'一個人','獨自':'一個人','單人':'一個人','多人聚餐':'多人','朋友':'約人','便宜':'省','平價':'省','普通價':'一般','貴':'犒賞','高價':'犒賞','外帶':'外送','需預約':'要預約','預約':'要預約','不用預約':'免預約','兩小時內':'2小時內','2小時':'2小時內','一整天':'整天','全天':'整天','半日':'半天','戶內':'室內','戶外活動':'戶外','累':'耗體力'};
  text.split(/\r?\n/).forEach(line=>{
    const f=line.split(/[\t,，、;；]/).map(s=>s.trim().replace(/^"|"$/g,'')).filter(Boolean);
    if(!f.length)return;const name=f[0];if(/^(名稱|名字|name)$/i.test(name))return;
    let cat=null,status='try';const found={food:{},act:{}},extra=[];
    f.slice(1).forEach(x=>{let k=norm(x);if(alias[k])k=alias[k];
      if(/^(吃|吃的|餐廳|美食|food)$/i.test(k)){cat='food';return}
      if(/^(活動|週末活動|周末活動|act|activity)$/i.test(k)){cat='act';return}
      if(k==='待嘗試'||k==='想試'){status='try';return}
      if(k==='喜歡'){status='like';return}
      if(k==='普通'){status='ok';return}
      let hit=false;
      ['food','act'].forEach(c=>DIM[c].forEach(d=>d.o.forEach(o=>{if(norm(o)===k){(found[c][d.k]=found[c][d.k]||[]).push(o);hit=true}})));
      if(!hit)extra.push(x)});
    if(!cat){const nf=Object.keys(found.food).length,na=Object.keys(found.act).length;cat=nf>na?'food':na>nf?'act':defCat}
    const t={};DIM[cat].forEach(d=>{const v=found[cat][d.k]||[];t[d.k]=d.multi?[...new Set(v)]:v.slice(0,1)});
    const key=cat+'|'+name.toLowerCase();if(seen.has(key)){dup++;return}seen.add(key);
    rows.push({id:uid(),cat,name,t,status,note:extra.join('，'),last:null,pend:false,booked:false})});
  return{rows,dup}}

const VIEWS={draw:vDraw,pool:vPool,edit:vEdit,set:vSet,bulk:vBulk};
function render(){
  document.getElementById('app').innerHTML=VIEWS[ui.tab]();
  const cur=({edit:'pool',bulk:'set'})[ui.tab]||ui.tab;
  document.getElementById('nav').innerHTML=[['draw','◎','抽選'],['pool','☰','選項池'],['set','⚙','設定']].map(t=>`<button class="${cur===t[0]?'on':''}" data-a="go" data-tab="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('');
  window.scrollTo(0,0)}

const A={
  go(d){ui.tab=d.tab;if(d.tab==='bulk')ui.bulk={text:'',rows:null};render()},
  cat(d){ui.cat=d.c;ui.f={};render()},
  filt(d){const a=ui.f[d.k]=ui.f[d.k]||[];const i=a.indexOf(d.v);i<0?a.push(d.v):a.splice(i,1);render()},
  draw(){const l=pool();if(!l.length)return toast('放寬條件，或先新增選項');const it=pickOne(l);ui.round={cur:it.id,seen:[it.id],left:MAXRE};render()},
  reroll(){const r=ui.round;if(!r||r.left<=0)return;const l=pool().filter(x=>!r.seen.includes(x.id));if(!l.length)return;const it=pickOne(l);r.cur=it.id;r.seen.push(it.id);r.left--;render()},
  accept(){const it=item(ui.round.cur);it.last=today();it.pend=true;it.booked=false;save();ui.round=null;toast('決定了：'+it.name);render()},
  cancelRound(){ui.round=null;render()},
  booked(d){const it=item(d.id);it.booked=!it.booked;save();render()},
  rate(d){const it=item(d.id);
    if(d.v==='del'){if(!confirm('把「'+it.name+'」從選項池移除？'))return;db.items=db.items.filter(x=>x.id!==it.id)}
    else{if(d.v!=='none')it.status=d.v;it.pend=false;it.booked=false}
    save();render()},
  poolCat(d){ui.poolCat=d.c;render()},
  bulkCat(d){ui.poolCat=d.c;ui.bulk.rows=null;render()},
  newItem(){const cat=ui.tab==='draw'?ui.cat:ui.poolCat;ui.edit={id:null,cat,name:'',t:{},status:'try',note:''};ui.tab='edit';render()},
  editItem(d){const it=item(d.id);ui.edit={id:it.id,cat:it.cat,name:it.name,t:JSON.parse(JSON.stringify(it.t)),status:it.status,note:it.note||''};ui.tab='edit';render()},
  setCat(d){if(ui.edit.cat!==d.c){ui.edit.cat=d.c;ui.edit.t={}}render()},
  setSt(d){ui.edit.status=d.v;render()},
  tag(d){const e=ui.edit,dim=DIM[e.cat].find(x=>x.k===d.k),a=e.t[d.k]||[];const i=a.indexOf(d.v);
    if(dim.multi){i<0?a.push(d.v):a.splice(i,1);e.t[d.k]=a}else e.t[d.k]=i<0?[d.v]:[];render()},
  saveItem(){const e=ui.edit,name=e.name.trim();if(!name)return toast('輸入名稱');
    if(db.items.some(x=>x.id!==e.id&&x.cat===e.cat&&x.name.toLowerCase()===name.toLowerCase()))return toast('選項池裡已經有了');
    const t={};DIM[e.cat].forEach(d=>t[d.k]=e.t[d.k]||[]);
    if(e.id)Object.assign(item(e.id),{cat:e.cat,name,t,status:e.status,note:e.note.trim()});
    else db.items.push({id:uid(),cat:e.cat,name,t,status:e.status,note:e.note.trim(),last:null,pend:false,booked:false});
    save();ui.poolCat=e.cat;ui.tab='pool';toast('已儲存');render()},
  delItem(){const it=item(ui.edit.id);if(!confirm('刪除「'+it.name+'」？'))return;db.items=db.items.filter(x=>x.id!==it.id);save();ui.tab='pool';render()},
  async export(){const name='what-to-do-backup-'+today()+'.json';const text=JSON.stringify({app:'what-to-do',v:1,at:new Date().toISOString(),data:{items:db.items}},null,1);
    const ok=await shareOrDownload(name,text);if(ok){db.lastExport=today();save();render()}},
  importPick(){document.getElementById('impFile').click()},
  bulkFile(){document.getElementById('bulkF').click()},
  bulkPreview(){const r=parseBulk(ui.bulk.text,ui.poolCat);ui.bulk.rows=r.rows;ui.bulk.dup=r.dup;render();const b=document.querySelector('[data-a=bulkCommit]');if(b)b.scrollIntoView({block:'end'})},
  bulkCommit(){const n=ui.bulk.rows.length;db.items.push(...ui.bulk.rows);save();ui.bulk={text:'',rows:null};ui.tab='pool';toast('已匯入 '+n+' 個');render()}
};

async function shareOrDownload(name,text){
  const file=new File([text],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return true}catch(e){if(e&&e.name==='AbortError')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.m){const[o,k]=el.dataset.m.split('.');ui[o][k]=el.value;if(o==='bulk')ui.bulk.rows=null}});
document.addEventListener('change',e=>{const el=e.target,f=el.files&&el.files[0];if(!f)return;
  const rd=new FileReader();
  if(el.id==='impFile'){rd.onload=()=>{try{const j=JSON.parse(rd.result);if(j.app!=='what-to-do'||!j.data||!Array.isArray(j.data.items))throw 0;
      if(!confirm('匯入 '+j.data.items.length+' 個選項，取代目前手機上的 '+db.items.length+' 個？'))return;
      db.items=j.data.items.filter(x=>x&&x.name&&DIM[x.cat]).map(x=>{const t={};DIM[x.cat].forEach(d=>{const v=x.t&&Array.isArray(x.t[d.k])?x.t[d.k].filter(o=>d.o.includes(o)):[];t[d.k]=v});return{id:x.id||uid(),cat:x.cat,name:String(x.name),t,status:ST[x.status]?x.status:'try',note:String(x.note||''),last:x.last||null,pend:!!x.pend,booked:!!x.booked}});
      save();ui.round=null;toast('已匯入');ui.tab='pool';render()}catch(x){alert('這不是「做什麼」的備份檔。')}};rd.readAsText(f)}
  if(el.id==='bulkF'){rd.onload=()=>{ui.bulk.text=String(rd.result);ui.bulk.rows=null;render()};rd.readAsText(f)}
  el.value=''});

render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
