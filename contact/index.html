<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>保持聯絡</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="保持聯絡">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#EEF1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06112D" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#EEF1F8;--card:#fff;--ink:#2B3445;--mut:#6B7385;--line:#dde2ee;--acc:#FFB3A0;--acc-ink:#4A2A22;--tint:#FFEAE3;--tint-ink:#A8523B;--mint:#E1F1FC;--mint-ink:#2C6A99;--danger:#C8463C}
@media (prefers-color-scheme: dark){:root{--bg:#06112D;--card:#101d42;--ink:#EEF1F8;--mut:#9aa4bd;--line:#24325e;--tint:#4a2a26;--tint-ink:#ffc4b0;--mint:#123a36;--mint-ink:#bdeee2;--danger:#ff8a80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:16px;line-height:1.5}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 84px);max-width:560px;margin:0 auto;min-height:100vh}
h1{font-size:24px;margin:8px 0 14px;font-weight:700}
h2{font-size:14px;color:var(--mut);font-weight:600;margin:18px 0 8px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.name{font-weight:600;font-size:17px}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--tint-ink);white-space:nowrap}
.pill.m{background:var(--mint);color:var(--mint-ink)}
.ask{background:var(--mint);color:var(--mint-ink);border-radius:12px;padding:8px 10px;font-size:14px;margin-top:8px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.d{color:var(--danger)}
button.w{width:100%}
button.s{min-height:36px;padding:6px 12px;font-size:14px}
input,textarea,select{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.av{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--tint-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.note{border-top:1px solid var(--line);padding:10px 0}
.note:first-child{border-top:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav button{border:none;background:none;min-height:48px;flex:1;color:var(--mut);font-size:13px;padding:4px}
nav button.on{color:var(--ink);font-weight:700}
nav b{display:block;font-size:20px;line-height:1.1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
.empty{text-align:center;padding:28px 12px}
.gap{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.back{border:none;background:none;padding:0;color:var(--mut);min-height:36px}
pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--bg);border-radius:12px;padding:10px;margin:8px 0}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:5}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
'use strict';
const VER='11/17';
const KEY='keepintouch.v1';
const CATS=['家人','好友','同事','舊識','其他'];
const IVS=[[14,'2 週'],[30,'1 個月'],[90,'3 個月'],[180,'半年']];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let db=load();
let ui={tab:'week',all:false,hq:'',doneId:null,dn:{t:''},q:'',cat:'',pid:null,edit:null,draft:newDraft(),logQ:'',bulk:{text:'',rows:null}};

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.people))return d}catch(e){}return{people:[],lastExport:null}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function days(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function md(s){return s?Number(s.slice(5,7))+'/'+Number(s.slice(8,10)):''}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function person(id){return db.people.find(p=>p.id===id)}
function ivName(n){const f=IVS.find(x=>x[0]===n);return f?f[1]:n+' 天'}
function newDraft(pid){return{pid:pid||null,text:'',ask:'',date:today()}}
function span(n){if(n<14)return n+' 天';if(n<60)return Math.round(n/7)+' 週';return Math.round(n/30)+' 個月'}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}

function dueList(){const t=today();return db.people.filter(p=>p.mode==='active'&&!(p.skip&&p.skip>t)).map(p=>({p,r:p.last?days(p.last,t)/p.iv:1.5})).filter(x=>x.r>=1).sort((a,b)=>b.r-a.r)}
function overLabel(p){if(!p.last)return'還沒有聯絡紀錄';const o=days(p.last,today())-p.iv;return o<=0?'到期了':'超過 '+span(o)}
function lastNote(p){return p.notes&&p.notes.length?p.notes[0]:null}

function dueCard(p){const n=lastNote(p);
  const act=ui.doneId===p.id?`<label>聊了什麼（選填）</label><input id="dnT" data-m="dn.t" value="${esc(ui.dn.t)}" placeholder="寫一句就好" autocomplete="off"><div class="gap"><button class="p s" data-a="doneSave">儲存</button><button class="s" data-a="doneSave" data-skip="1">不寫，直接完成</button><button class="s" data-a="doneCancel">取消</button></div>`
    :`<div class="gap"><button class="p s" data-a="done" data-id="${p.id}">已聯絡</button><button class="s" data-a="logFor" data-id="${p.id}">記一筆</button><button class="s" data-a="skip" data-id="${p.id}">這週跳過</button></div>`;
  return`<div class="card"><div class="row sp"><span class="name" data-a="open" data-id="${p.id}">${esc(p.name)}</span><span class="pill">${overLabel(p)}</span></div>
    <div class="mut">${esc(p.cat)} · 理想每 ${ivName(p.iv)}</div>
    ${p.ask?`<div class="ask">下次可以問：${esc(p.ask)}</div>`:''}
    ${n?`<div class="mut" style="margin-top:6px">上次聊（${md(n.d)}）：${esc(n.t)}</div>`:''}${act}</div>`}
function weekBody(){
  const due=dueList(),show=ui.all?due:due.slice(0,3);
  let h='<h2>本週該聯絡</h2>';
  if(!due.length){
    const t=today(),up=db.people.filter(p=>p.mode==='active'&&p.last).map(p=>({p,n:p.iv-days(p.last,t)})).filter(x=>x.n>0).sort((a,b)=>a.n-b.n)[0];
    h+=`<div class="card empty"><p class="name">這週沒有需要聯絡的人</p><p class="mut">${up?'下一位是 '+esc(up.p.name)+'，'+span(up.n)+'後':'把想維繫的人設為「主動聯絡」，到期時會出現在這裡。'}</p></div>`;
  }
  show.forEach(({p})=>{h+=dueCard(p)});
  if(due.length>3)h+=`<button class="w" data-a="toggleAll">${ui.all?'只看最該聯絡的 3 位':'看全部到期的 '+due.length+' 位'}</button>`;
  if(due.length)h+=`<p class="mut" style="text-align:center">其他 ${db.people.length-due.length} 人目前不用擔心</p>`;
  return h}
function searchBody(){
  const raw=ui.hq.trim(),q=raw.toLowerCase();
  const res=db.people.map(p=>{const byName=p.name.toLowerCase().includes(q),hit=p.notes.find(n=>n.t.toLowerCase().includes(q)),other=(p.ask||'').toLowerCase().includes(q)||(p.memo||'').toLowerCase().includes(q);return byName||hit||other?{p,byName,hit}:null}).filter(Boolean).sort((a,b)=>(b.byName-a.byName)||a.p.name.localeCompare(b.p.name,'zh-Hant')).slice(0,12);
  let h=res.length?'':'<p class="mut">找不到符合的人或紀錄</p>';
  res.forEach(({p,byName,hit})=>{const ns=!byName&&hit?[hit]:p.notes.slice(0,2);
    h+=`<div class="card"><div class="row sp"><span class="name" data-a="open" data-id="${p.id}">${esc(p.name)}</span><span class="pill ${p.mode==='active'?'':'m'}">${esc(p.cat)}</span></div>
    ${p.ask?`<div class="ask">下次可以問：${esc(p.ask)}</div>`:''}
    ${p.memo?`<div class="mut" style="margin-top:6px">備註：${esc(p.memo)}</div>`:''}
    ${ns.length?ns.map(n=>`<div style="margin-top:6px"><span class="mut">${md(n.d)}</span> ${esc(n.t)}</div>`).join(''):'<div class="mut" style="margin-top:6px">還沒有紀錄</div>'}
    <div class="gap"><button class="p s" data-a="logFor" data-id="${p.id}">記一筆</button><button class="s" data-a="open" data-id="${p.id}">看全部</button></div></div>`});
  if(!db.people.some(p=>p.name.toLowerCase()===q))h+=`<button class="w" data-a="hAdd">＋ 新增「${esc(raw)}」並記一筆</button>`;
  return h}
function vWeek(){
  if(!db.people.length)return`<h1>保持聯絡</h1><div class="card empty"><p class="name">先建立你的名單</p><p class="mut">加入想保持聯絡的人，或只是想記住聊過什麼的人。</p><div class="gap" style="justify-content:center"><button class="p" data-a="newPerson">新增一個人</button><button data-a="go" data-tab="bulk">批次匯入</button></div></div>`;
  return`<h1>保持聯絡</h1><input id="hq" data-i="hq" placeholder="搜尋名字或聊過的事" value="${esc(ui.hq)}" autocomplete="off"><div id="hres" style="margin-top:12px">${ui.hq.trim()?searchBody():weekBody()}</div>`}

function chipsHtml(){
  const q=ui.logQ.trim().toLowerCase();
  let list=db.people.slice();
  if(q)list=list.filter(p=>p.name.toLowerCase().includes(q));
  else list.sort((a,b)=>(b.last||'').localeCompare(a.last||''));
  list=list.slice(0,8);
  let h=list.map(p=>`<button class="chip ${ui.draft.pid===p.id?'on':''}" data-a="pick" data-id="${p.id}">${esc(p.name)}</button>`).join('');
  const exact=db.people.some(p=>p.name.toLowerCase()===q);
  if(q&&!exact)h+=`<button class="chip" data-a="quickAdd">＋ 新增「${esc(ui.logQ.trim())}」</button>`;
  if(!q&&!db.people.length)h='<span class="mut">輸入名字就能新增第一個人</span>';
  return h}
function vLog(){
  const p=person(ui.draft.pid);
  return`<h1>記一筆</h1>
  <label>跟誰聊</label><input id="logQ" placeholder="搜尋或輸入新名字" value="${esc(ui.logQ)}" data-i="logQ" autocomplete="off">
  <div class="chips" id="chips" style="margin-top:8px">${chipsHtml()}</div>
  ${p&&p.ask?`<div class="ask">上次留的：${esc(p.ask)}</div>`:''}
  <label>聊了什麼</label><textarea data-m="draft.text" id="dText" placeholder="電梯遇到，她說下個月要搬家">${esc(ui.draft.text)}</textarea>
  ${SR?'<div class="gap" style="margin-top:6px"><button class="s" data-a="mic" data-t="dText">用說的</button></div>':''}
  <p class="mut">也可以點輸入框後，按鍵盤上的麥克風用說的。</p>
  <label>下次可以問（選填）</label><input data-m="draft.ask" placeholder="搬家順不順利" value="${esc(ui.draft.ask)}">
  <label>日期</label><input type="date" data-m="draft.date" value="${ui.draft.date}" max="${today()}">
  <div class="gap"><button class="p w" data-a="saveLog">儲存</button></div>`}

function rowsHtml(){
  const q=ui.q.trim().toLowerCase();
  let l=db.people.filter(p=>(!ui.cat||p.cat===ui.cat)&&(!q||p.name.toLowerCase().includes(q)));
  l.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  if(!l.length)return'<div class="card empty mut">沒有符合的人</div>';
  return l.map(p=>{const n=lastNote(p);return`<div class="card row" data-a="open" data-id="${p.id}"><div class="av">${esc(p.name.slice(0,1))}</div><div style="min-width:0;flex:1"><div class="row sp"><span class="name">${esc(p.name)}</span><span class="pill ${p.mode==='active'?'':'m'}">${p.mode==='active'?'主動聯絡':'只記錄'}</span></div><div class="mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.cat)}${n?' · '+md(n.d)+' '+esc(n.t):''}</div></div></div>`}).join('')}
function vList(){
  return`<div class="row sp"><h1>名單</h1><button class="p s" data-a="newPerson">＋ 新增</button></div>
  <input placeholder="搜尋名字" value="${esc(ui.q)}" data-i="q" autocomplete="off">
  <div class="chips" style="margin:10px 0">${['',...CATS].map(c=>`<button class="chip ${ui.cat===c?'on':''}" data-a="cat" data-c="${c}">${c||'全部'}</button>`).join('')}</div>
  <div id="rows">${rowsHtml()}</div>
  <p class="mut" style="text-align:center">共 ${db.people.length} 人</p>`}

function vPerson(){
  const p=person(ui.pid);if(!p){ui.tab='list';return vList()}
  const act=p.mode==='active';
  return`<button class="back" data-a="go" data-tab="list">‹ 名單</button>
  <div class="row" style="margin:6px 0 12px"><div class="av">${esc(p.name.slice(0,1))}</div><div><div class="name" style="font-size:22px">${esc(p.name)}</div><div class="mut">${esc(p.cat)} · ${act?'主動聯絡，每 '+ivName(p.iv):'只記錄'}${p.last?' · 上次 '+md(p.last):''}</div></div></div>
  ${p.memo?`<p class="mut" style="margin:0 0 10px">備註：${esc(p.memo)}</p>`:''}
  ${p.ask?`<div class="ask" style="margin-bottom:10px">下次可以問：${esc(p.ask)} <button class="s" style="margin-left:6px" data-a="clearAsk">問過了</button></div>`:''}
  <div class="gap" style="margin:0 0 6px"><button class="p" data-a="logFor" data-id="${p.id}">記一筆</button><button data-a="editPerson">編輯</button><button data-a="toggleMode">${act?'改為只記錄':'改為主動聯絡'}</button></div>
  <h2>聊過的事</h2>
  <div class="card">${p.notes.length?p.notes.map((n,i)=>`<div class="note"><div class="row sp"><span class="mut">${n.d}</span><button class="s d" style="min-height:28px;border:none;padding:0 4px" data-a="delNote" data-i="${i}">刪除</button></div>${esc(n.t)}</div>`).join(''):'<div class="mut">還沒有紀錄</div>'}</div>`}

function vEdit(){
  const e=ui.edit,act=e.mode==='active';
  return`<button class="back" data-a="cancelEdit">‹ 取消</button><h1>${e.id?'編輯':'新增一個人'}</h1>
  <label>名字</label><input data-m="edit.name" value="${esc(e.name)}" placeholder="Mei" autocomplete="off">
  <label>分類</label><div class="chips">${CATS.map(c=>`<button class="chip ${e.cat===c?'on':''}" data-a="setE" data-k="cat" data-v="${c}">${c}</button>`).join('')}</div>
  <label>模式</label><div class="seg"><button class="chip ${act?'on':''}" data-a="setE" data-k="mode" data-v="active">主動聯絡</button><button class="chip ${act?'':'on'}" data-a="setE" data-k="mode" data-v="log">只記錄</button></div>
  <p class="mut">${act?'超過間隔沒聯絡時，會出現在「本週該聯絡」。':'不會提醒，只在你查詢時顯示聊過什麼。'}</p>
  ${act?`<label>理想間隔</label><div class="chips">${IVS.map(v=>`<button class="chip ${e.iv===v[0]?'on':''}" data-a="setE" data-k="iv" data-v="${v[0]}">${v[1]}</button>`).join('')}</div>
  <label>上次聯絡日（選填）</label><input type="date" data-m="edit.last" value="${e.last||''}" max="${today()}">`:''}
  <label>下次可以問（選填）</label><input data-m="edit.ask" value="${esc(e.ask||'')}">
  <label>備註（選填）</label><input data-m="edit.memo" value="${esc(e.memo||'')}" placeholder="哪個部門、怎麼認識的">
  <div class="gap"><button class="p w" data-a="saveEdit">儲存</button></div>
  ${e.id?'<div class="gap"><button class="d w" data-a="delPerson">刪除這個人</button></div>':''}`}

function vSet(){
  return`<h1>設定</h1>
  <h2>備份</h2><div class="card"><p class="mut" style="margin-top:0">資料只存在這支手機。換手機前先匯出，到新手機再匯入。備份是 CSV 檔，可以用試算表打開。${db.lastExport?'上次匯出：'+db.lastExport:'還沒匯出過。'}</p>
  <div class="gap"><button class="p" data-a="export">匯出備份</button><button data-a="importPick">匯入備份</button></div><input type="file" id="impFile" hidden></div>
  <h2>更新</h2><div class="card"><p class="mut" style="margin-top:0">有網路時，每次打開都會自動載入最新版。目前版本 ${VER}。</p><button data-a="refresh">重新整理</button></div>
  <h2>初始設定</h2><div class="card"><p class="mut" style="margin-top:0">一次加入很多人。</p><button data-a="go" data-tab="bulk">批次匯入名單</button></div>
  <p class="mut" style="text-align:center">共 ${db.people.length} 人 · ${db.people.reduce((s,p)=>s+p.notes.length,0)} 筆紀錄</p>`}

function vBulk(){
  const b=ui.bulk;
  let h=`<button class="back" data-a="go" data-tab="set">‹ 設定</button><h1>批次匯入</h1>
  <p class="mut">一行一個人，第一欄是名字。其他欄用逗號或 Tab 分隔，順序不拘，認不出的字會放進備註。</p>
  <pre>Mei, 同事, 只記錄
小安, 好友, 主動, 1個月, 2026-10-20
媽媽, 家人, 主動, 2週, 喜歡聽我講工作的事</pre>
  <p class="mut">可用的字：分類（${CATS.join('、')}）、模式（主動、只記錄）、間隔（2週、1個月、3個月、半年）、日期（2026-10-20）。沒寫模式時，同事預設只記錄，其他預設主動聯絡每月一次。</p>
  <textarea data-m="bulk.text" id="bulkText" style="min-height:160px" placeholder="從試算表或記事本貼上">${esc(b.text)}</textarea>
  <div class="gap"><button data-a="bulkFile">選擇檔案（.csv / .txt）</button><button class="p" data-a="bulkPreview">預覽</button></div><input type="file" id="bulkF" hidden>`;
  if(b.rows){
    h+=`<h2>預覽：${b.rows.length} 人${b.dup?'，另有 '+b.dup+' 人已在名單中會略過':''}</h2><div class="card">${b.rows.length?b.rows.map(r=>`<div class="note"><span class="name">${esc(r.name)}</span> <span class="pill ${r.mode==='active'?'':'m'}">${r.mode==='active'?'主動 · '+ivName(r.iv):'只記錄'}</span><div class="mut">${esc(r.cat)}${r.last?' · 上次 '+r.last:''}${r.memo?' · 備註：'+esc(r.memo):''}</div></div>`).join(''):'<div class="mut">沒有可匯入的資料</div>'}</div>
    ${b.rows.length?`<button class="p w" data-a="bulkCommit">匯入這 ${b.rows.length} 人</button>`:''}`}
  return h}

function parseBulk(text){
  const rows=[];let dup=0;const seen=new Set(db.people.map(p=>p.name.toLowerCase()));
  text.split(/\r?\n/).forEach(line=>{
    const f=line.split(/[\t,，、;；]/).map(s=>s.trim().replace(/^"|"$/g,'')).filter(Boolean);
    if(!f.length)return;const name=f[0];
    if(/^(名字|姓名|name)$/i.test(name))return;
    if(seen.has(name.toLowerCase())){dup++;return}seen.add(name.toLowerCase());
    const r={id:uid(),name,cat:'其他',mode:null,iv:30,last:null,ask:'',memo:'',notes:[],skip:null};const extra=[];
    f.slice(1).forEach(x=>{const k=x.replace(/\s/g,'');let m;
      if(CATS.includes(k))r.cat=k;
      else if(k==='朋友')r.cat='好友';
      else if(/^主動/.test(k))r.mode='active';
      else if(/^(只記錄|只紀錄|記錄|紀錄|被動)/.test(k))r.mode='log';
      else if(/^(2週|兩週|二週|14天)$/.test(k))r.iv=14;
      else if(/^(1個月|一個月|每月|30天)$/.test(k))r.iv=30;
      else if(/^(3個月|三個月|一季|90天)$/.test(k))r.iv=90;
      else if(/^(半年|6個月|六個月|180天)$/.test(k))r.iv=180;
      else if((m=k.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/)))r.last=m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
      else extra.push(x)});
    if(!r.mode)r.mode=r.cat==='同事'?'log':'active';
    if(r.last&&r.last>today())r.last=today();
    if(extra.length)r.memo=extra.join('，');
    rows.push(r)});
  return{rows,dup}}

function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n'}
function parseCsv(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);rows.push(row);row=[];c=''}else c+=ch}
  if(c!==''||row.length){row.push(c);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function normDate(s){s=String(s||'').trim();let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+'-'+pad(m[1])+'-'+pad(m[2]);return''}
const CH=['名字','分類','模式','間隔','上次聯絡日','下次可以問','備註','紀錄日期','紀錄內容'];
function backupCsv(){const rows=[CH];db.people.forEach(p=>{const b=[p.name,p.cat,p.mode==='active'?'主動聯絡':'只記錄',ivName(p.iv),p.last||'',p.ask||'',p.memo||''];
  if(p.notes.length)p.notes.forEach(n=>rows.push([...b,n.d,n.t]));else rows.push([...b,'',''])});return toCsv(rows)}
function readBackup(text){text=text.replace(/^﻿/,'');if(text.trim().startsWith('{'))return JSON.parse(text);
  const rows=parseCsv(text),h=(rows[0]||[]).map(x=>x.trim()),col=n=>h.indexOf(n);if(h[0]!=='名字'||col('紀錄內容')<0)throw 0;
  const g=(r,n)=>{const i=col(n);return i<0?'':String(r[i]||'').trim()},map=new Map();
  rows.slice(1).forEach(r=>{const name=g(r,'名字');if(!name)return;let q=map.get(name);
    if(!q){const ivs=g(r,'間隔').replace(/\s/g,''),f=IVS.find(v=>v[1].replace(/\s/g,'')===ivs);
      q={name,cat:g(r,'分類'),mode:/主動/.test(g(r,'模式'))?'active':'log',iv:f?f[0]:(parseInt(ivs)||30),last:normDate(g(r,'上次聯絡日'))||null,ask:g(r,'下次可以問'),memo:g(r,'備註'),notes:[]};map.set(name,q)}
    const t=g(r,'紀錄內容');if(t)q.notes.push({d:normDate(g(r,'紀錄日期'))||q.last||today(),t})});
  const people=[...map.values()];people.forEach(q=>q.notes.sort((a,b)=>b.d.localeCompare(a.d)));return{app:'keep-in-touch',data:{people}}}
const VIEWS={week:vWeek,log:vLog,list:vList,person:vPerson,edit:vEdit,set:vSet,bulk:vBulk};
function render(){
  document.getElementById('app').innerHTML=VIEWS[ui.tab]();
  const cur=({person:'list',edit:'list',bulk:'set'})[ui.tab]||ui.tab;
  document.getElementById('nav').innerHTML=[['week','◎','本週'],['log','＋','記一筆'],['list','☰','名單'],['set','⚙','設定']].map(t=>`<button class="${cur===t[0]?'on':''}" data-a="go" data-tab="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('');
  window.scrollTo(0,0)}

const A={
  go(d){ui.tab=d.tab;ui.hq='';ui.doneId=null;if(d.tab==='bulk')ui.bulk={text:'',rows:null};render()},
  toggleAll(){ui.all=!ui.all;render()},
  open(d){ui.pid=d.id;ui.tab='person';render()},
  done(d){ui.doneId=d.id;ui.dn={t:''};render();const el=document.getElementById('dnT');if(el){el.scrollIntoView({block:'center'});el.focus()}},
  doneSave(d){const p=person(ui.doneId);if(!p)return;const t=d.skip?'':ui.dn.t.trim();p.last=today();p.skip=null;if(t)p.notes.unshift({d:today(),t});save();ui.doneId=null;ui.dn={t:''};toast('已記錄今天聯絡過 '+p.name);render()},
  doneCancel(){ui.doneId=null;render()},
  hAdd(){const name=ui.hq.trim();if(!name)return;const p={id:uid(),name,cat:'同事',mode:'log',iv:30,last:null,ask:'',memo:'',notes:[],skip:null};db.people.push(p);save();ui.hq='';ui.draft=newDraft(p.id);ui.logQ='';ui.tab='log';toast('已新增 '+name+'（只記錄）');render()},
  skip(d){const p=person(d.id);p.skip=addDays(today(),7);save();toast('一週後再提醒');render()},
  logFor(d){ui.draft=newDraft(d.id);ui.logQ='';ui.tab='log';render()},
  pick(d){ui.draft.pid=ui.draft.pid===d.id?null:d.id;render()},
  quickAdd(){const name=ui.logQ.trim();if(!name)return;const p={id:uid(),name,cat:'同事',mode:'log',iv:30,last:null,ask:'',notes:[],skip:null};db.people.push(p);save();ui.draft.pid=p.id;ui.logQ='';toast('已新增 '+name+'（只記錄）');render()},
  saveLog(){const d=ui.draft,p=person(d.pid);if(!p)return toast('先選一個人');if(!d.text.trim())return toast('寫下聊了什麼');
    const date=d.date&&d.date<=today()?d.date:today();
    p.notes.push({d:date,t:d.text.trim()});p.notes.sort((a,b)=>b.d.localeCompare(a.d));
    if(!p.last||date>p.last)p.last=date;if(d.ask.trim())p.ask=d.ask.trim();p.skip=null;save();
    ui.draft=newDraft();ui.logQ='';ui.pid=p.id;ui.tab='person';toast('已儲存');render()},
  cat(d){ui.cat=d.c;render()},
  newPerson(){ui.edit={id:null,name:'',cat:'好友',mode:'active',iv:30,last:'',ask:'',memo:''};ui.tab='edit';render()},
  editPerson(){const p=person(ui.pid);ui.edit={id:p.id,name:p.name,cat:p.cat,mode:p.mode,iv:p.iv,last:p.last||'',ask:p.ask||'',memo:p.memo||''};ui.tab='edit';render()},
  setE(d){ui.edit[d.k]=d.k==='iv'?Number(d.v):d.v;render()},
  cancelEdit(){ui.tab=ui.edit.id?'person':'list';render()},
  saveEdit(){const e=ui.edit,name=e.name.trim();if(!name)return toast('輸入名字');
    if(db.people.some(p=>p.id!==e.id&&p.name.toLowerCase()===name.toLowerCase()))return toast('名單裡已經有這個名字');
    const last=e.last&&e.last<=today()?e.last:null;
    if(e.id){const p=person(e.id);Object.assign(p,{name,cat:e.cat,mode:e.mode,iv:e.iv,ask:e.ask.trim(),memo:(e.memo||'').trim()});if(e.mode==='active'&&last)p.last=last}
    else{const p={id:uid(),name,cat:e.cat,mode:e.mode,iv:e.iv,last:e.mode==='active'?last:null,ask:e.ask.trim(),memo:(e.memo||'').trim(),notes:[],skip:null};db.people.push(p);ui.pid=p.id}
    save();ui.tab='person';toast('已儲存');render()},
  delPerson(){const p=person(ui.edit.id);if(!confirm('刪除 '+p.name+' 和所有紀錄？這無法復原。'))return;db.people=db.people.filter(x=>x.id!==p.id);save();ui.tab='list';render()},
  toggleMode(){const p=person(ui.pid);p.mode=p.mode==='active'?'log':'active';save();toast(p.mode==='active'?'已改為主動聯絡，每 '+ivName(p.iv):'已改為只記錄');render()},
  clearAsk(){person(ui.pid).ask='';save();render()},
  delNote(d){const p=person(ui.pid);if(!confirm('刪除這筆紀錄？'))return;p.notes.splice(Number(d.i),1);save();render()},
  mic(d){if(!SR)return;const el=document.getElementById(d.t);const r=new SR();r.lang='zh-TW';r.interimResults=false;
    r.onresult=e=>{const s=e.results[0][0].transcript;el.value=(el.value?el.value+' ':'')+s;el.dispatchEvent(new Event('input',{bubbles:true}))};
    r.onerror=()=>toast('語音沒有成功，改用鍵盤上的麥克風');try{r.start();toast('請說話')}catch(e){toast('語音沒有成功，改用鍵盤上的麥克風')}},
  async export(){const name='keep-in-touch-backup-'+today()+'.csv';const text=backupCsv();
    const ok=await shareOrDownload(name,text);if(ok){db.lastExport=today();save();render()}},
  async refresh(){if(!navigator.onLine)return toast('目前沒有網路');toast('更新中');
    try{if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}
      if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('kit-')).map(k=>caches.delete(k)))}}catch(e){}
    location.reload()},
  importPick(){document.getElementById('impFile').click()},
  bulkFile(){document.getElementById('bulkF').click()},
  bulkPreview(){const r=parseBulk(ui.bulk.text);ui.bulk.rows=r.rows;ui.bulk.dup=r.dup;render();const b=document.querySelector('[data-a=bulkCommit]');if(b)b.scrollIntoView({block:'end'})},
  bulkCommit(){const n=ui.bulk.rows.length;db.people.push(...ui.bulk.rows);save();ui.bulk={text:'',rows:null};ui.tab='list';toast('已匯入 '+n+' 人');render()}
};

async function shareOrDownload(name,text){
  const file=new File([text],name,{type:'text/csv'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return true}catch(e){if(e&&e.name==='AbortError')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el.dataset)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.m){const[o,k]=el.dataset.m.split('.');ui[o][k]=el.value;if(o==='bulk')ui.bulk.rows=null}
  if(el.dataset.i==='logQ'){ui.logQ=el.value;document.getElementById('chips').innerHTML=chipsHtml()}
  if(el.dataset.i==='hq'){ui.hq=el.value;ui.doneId=null;document.getElementById('hres').innerHTML=ui.hq.trim()?searchBody():weekBody()}
  if(el.dataset.i==='q'){ui.q=el.value;document.getElementById('rows').innerHTML=rowsHtml()}});
document.addEventListener('change',e=>{const el=e.target,f=el.files&&el.files[0];if(!f)return;
  const rd=new FileReader();
  if(el.id==='impFile'){rd.onload=()=>{try{const j=readBackup(String(rd.result));if(j.app!=='keep-in-touch'||!j.data||!Array.isArray(j.data.people))throw 0;
      if(!confirm('匯入 '+j.data.people.length+' 人，取代目前手機上的 '+db.people.length+' 人？'))return;
      db.people=j.data.people.map(p=>({id:p.id||uid(),name:String(p.name||''),cat:CATS.includes(p.cat)?p.cat:'其他',mode:p.mode==='active'?'active':'log',iv:Number(p.iv)||30,last:p.last||null,ask:p.ask||'',memo:p.memo||'',notes:Array.isArray(p.notes)?p.notes.map(n=>({d:String(n.d||today()),t:String(n.t||'')})):[],skip:p.skip||null})).filter(p=>p.name);
      save();toast('已匯入');ui.tab='list';render()}catch(x){alert('這不是「保持聯絡」的備份檔。')}};rd.readAsText(f)}
  if(el.id==='bulkF'){rd.onload=()=>{ui.bulk.text=String(rd.result);ui.bulk.rows=null;render()};rd.readAsText(f)}
  el.value=''});

render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
